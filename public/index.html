<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGLARD OS</title>
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDE8; --line:#D5DBD3;
  --ink:#16251F; --muted:#5B6A62; --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEDE6;
  --warn:#9A6200; --warn-soft:#FBEFD6; --bad:#B3261E; --bad-soft:#FBE3E0; --good:#22743F; --good-soft:#DFF1E4;
  --rail:#16302A; --rail-ink:#D7E4DE; --rail-active:#244A40;
  --f-body:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1714; --surface:#16211D; --sunk:#1C2924; --line:#2A3A34;
  --ink:#E4ECE8; --muted:#9AAEA5; --accent:#4FB394; --accent-ink:#0B1411; --accent-soft:#1D3A31;
  --warn:#E6B04F; --warn-soft:#3A2E14; --bad:#F2877F; --bad-soft:#3D1D1A; --good:#6CCB8C; --good-soft:#18331F;
  --rail:#0B1310; --rail-ink:#B9CBC3; --rail-active:#1D3A31; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-size:21px;font-weight:700;color:#fff;padding:4px 10px 18px}
.brand small{display:block;font-size:12px;font-weight:400;opacity:.8}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--rail-ink);text-decoration:none}
.nav:hover{background:var(--rail-active)}
.nav[aria-current="page"]{background:var(--rail-active);color:#fff;font-weight:600}
.nav .cnt{margin-inline-start:auto;background:rgba(255,255,255,.14);border-radius:20px;padding:0 8px;font-size:12px}
main{min-width:0;padding:24px clamp(16px,3vw,32px) 48px;max-width:1180px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:17px;margin:24px 0 10px}
.sub{color:var(--muted);margin:0 0 20px}
main a:not(.btn){color:var(--accent)}
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:26px}
.kpi span{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.card .grow{flex:1;min-width:200px}
.card small{color:var(--muted)}
.table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.table th,.table td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
.table th{background:var(--sunk);font-size:13px;color:var(--muted);font-weight:600}
.table tr:last-child td{border-bottom:0}
.table tr.click{cursor:pointer}
.table tr.click:hover td{background:var(--sunk)}
.wrap{overflow-x:auto}
.pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12.5px;background:var(--sunk);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);padding:18px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{padding:20px}
dialog h3{margin:0 0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font-size:15px}
.actions{display:flex;gap:8px;justify-content:flex-start;margin-top:18px}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin-top:8px}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.timeline small{color:var(--muted)}
.next{background:var(--accent-soft);border-radius:10px;padding:14px 16px;margin:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rail .me{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.rail .me button{background:none;border:0;color:var(--rail-ink);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}
.login{min-height:100vh;display:grid;place-items:center;max-width:none;padding:16px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px}
  .brand{display:none}
  .nav{white-space:nowrap}
  .rail .me{margin:0;border:0;white-space:nowrap}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="ניווט ראשי">
    <div class="brand">MAGLARD OS<small>ניהול דירות ותפעול</small></div>
    <a class="nav" href="#/">מרכז עבודה <span class="cnt" id="cnt-work"></span></a>
    <a class="nav" href="#/apartments">דירות</a>
    <a class="nav" href="#/requests">קריאות שירות <span class="cnt" id="cnt-req"></span></a>
    <a class="nav" href="#/invoices">חשבוניות ספק</a>
    <a class="nav" href="#/sync">סנכרון Planfix <span class="cnt" id="cnt-sync"></span></a>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
