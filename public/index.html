<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGLARD OS</title>
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --sunk:#E9EDE8; --line:#D5DBD3; --field:#7F8D85;
  --ink:#16251F; --muted:#5B6A62; --accent:#1E6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEDE6;
  --warn:#8A5700; --warn-soft:#FBEFD6; --bad:#B3261E; --bad-soft:#FBE3E0; --good:#22743F; --good-soft:#DFF1E4;
  --rail:#16302A; --rail-ink:#D7E4DE; --rail-active:#244A40;
  --f-body:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1714; --surface:#16211D; --sunk:#1C2924; --line:#2A3A34; --field:#5E7068;
  --ink:#E4ECE8; --muted:#9AAEA5; --accent:#4FB394; --accent-ink:#0B1411; --accent-soft:#1D3A31;
  --warn:#E6B04F; --warn-soft:#3A2E14; --bad:#F2877F; --bad-soft:#3D1D1A; --good:#6CCB8C; --good-soft:#18331F;
  --rail:#0B1310; --rail-ink:#B9CBC3; --rail-active:#1D3A31; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-size:21px;font-weight:700;color:#fff;padding:4px 10px 18px}
.brand small{display:block;font-size:12px;font-weight:400;color:var(--rail-ink)}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--rail-ink);text-decoration:none}
.nav:hover{background:var(--rail-active)}
.nav[aria-current="page"]{background:var(--rail-active);color:#fff;font-weight:600}
.nav .cnt{margin-inline-start:auto;background:rgba(255,255,255,.14);border-radius:20px;padding:0 8px;font-size:12px}
.main{min-width:0}
main{min-width:0;padding:8px clamp(16px,3vw,32px) 48px;max-width:1180px}
.top{position:relative;padding:16px clamp(16px,3vw,32px) 0;max-width:1180px}
.top input{width:100%;background:var(--surface)}
.hits{position:absolute;inset-inline:clamp(16px,3vw,32px);top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:5;max-height:60vh;overflow:auto}
.hits a{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.hits a:last-child{border-bottom:0}
.hits a:hover,.hits a.on{background:var(--sunk)}
.hits small{color:var(--muted)}
.missing{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin:12px 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.facts span{display:block;color:var(--muted);font-size:13px}
h1{font-size:26px;margin:0 0 4px}
h2{font-size:17px;margin:24px 0 10px}
.sub{color:var(--muted);margin:0 0 20px}
main a:not(.btn){color:var(--accent)}
.head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:26px}
a.kpi{color:inherit;text-decoration:none}
a.kpi:hover{border-color:var(--accent)}
.kpi.bad b{color:var(--bad)}
.kpi.warn b{color:var(--warn)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs .btn{text-decoration:none;color:inherit}
.tabs .btn.primary{color:var(--accent-ink)}
.kpi span{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.card .grow{flex:1;min-width:200px}
.card small{color:var(--muted)}
.table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.table th,.table td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
.table th{background:var(--sunk);font-size:13px;color:var(--muted);font-weight:600}
.table tr:last-child td{border-bottom:0}
.table tr.click{cursor:pointer}
.table tr.click:hover td{background:var(--sunk)}
.wrap{overflow-x:auto}
.pill{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12.5px;background:var(--sunk);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--muted);padding:18px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:10px}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog form{padding:20px}
dialog h3{margin:0 0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.grid>*{min-width:0}
[hidden]{display:none!important}
select,input{max-width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{border:1px solid var(--field);border-radius:8px;padding:8px 10px;background:var(--bg);color:var(--ink);font-size:15px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;margin-top:18px}
.err{color:var(--bad);font-size:13px;min-height:1.2em;margin-top:8px}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.timeline small{color:var(--muted)}
.next{background:var(--accent-soft);border-radius:10px;padding:14px 16px;margin:12px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rail .me{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
.nav[hidden]{display:none}
.files{display:flex;flex-wrap:wrap;gap:10px}
.thumb{width:132px;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;text-decoration:none;color:var(--ink)}
.thumb img{width:100%;height:92px;object-fit:cover;border-radius:6px;background:var(--sunk)}
.thumb small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb.doc b{height:92px;display:grid;place-items:center;background:var(--sunk);border-radius:6px;color:var(--accent)}
.thumb.add{justify-content:center;align-items:center;min-height:120px;border-style:dashed;cursor:pointer;color:var(--accent);font-size:14px}
.card.unread{border-color:var(--accent)}
.rail .me small{display:block}
.rail .me button{background:none;border:0;color:var(--rail-ink);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}
.login{min-height:100vh;display:grid;place-items:center;max-width:none;padding:16px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.rail .links{display:flex;flex-direction:column;gap:4px}
.skip{position:absolute;inset-inline-start:8px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:8px;z-index:20}
.skip:focus{top:8px}
h1:focus,h2:focus{outline:none}
.toc{display:flex;flex-wrap:wrap;gap:8px 16px;margin:0 0 14px}
.guide h2{margin:0 0 6px;font-size:17px}
.guide ol{margin:0;padding-inline-start:20px}
.guide li{margin:3px 0}
.welcome{border-color:var(--accent);background:var(--accent-soft)}
.menu-btn{display:none}
.ferr{color:var(--bad);font-size:12.5px;min-height:0}
input[aria-invalid="true"]{border-color:var(--bad)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:0 0 12px}
.filters label{min-width:140px}
.filters .count{color:var(--muted);font-size:13px;margin-inline-start:auto}
body.loading main#view{opacity:.55;transition:opacity .15s}
body.loading::before{content:"";position:fixed;top:0;inset-inline:0;height:3px;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:load 1s linear infinite;z-index:10}
@keyframes load{from{background-position:-50% 0}to{background-position:150% 0}}
@media (prefers-reduced-motion:reduce){body.loading::before{animation:none;background:var(--accent)}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{position:sticky;top:0;z-index:5;height:auto;padding:8px 10px}
  .brand{display:none}
  .menu-btn{display:flex;align-items:center;gap:8px;width:100%;background:var(--rail-active);color:#fff;border:0;border-radius:8px;padding:10px 12px;font-weight:600;cursor:pointer;text-align:start}
  .rail .links,.rail .me{display:none}
  .rail.open .links{display:flex;max-height:70vh;overflow-y:auto;padding-top:6px}
  .rail.open .me{display:block;margin:6px 0 0}
  .grid{grid-template-columns:1fr}
  .filters label{min-width:0;flex:1 1 45%}
  .table.stack thead{display:none}
  .table.stack,.table.stack tbody,.table.stack tr,.table.stack td{display:block;width:100%}
  .table.stack tr{border-bottom:1px solid var(--line);padding:6px 0}
  .table.stack td{border:0;padding:4px 12px;display:flex;gap:10px;justify-content:space-between}
  .table.stack td[data-label]::before{content:attr(data-label);color:var(--muted);font-size:13px;flex:none}
}
@media print{
  .rail,.top,.no-print,.toast{display:none!important}
  .app{display:block}
  body{background:#fff}
}
</style>
</head>
<body>
<a class="skip" href="#view" id="skip">דלג לתוכן</a>
<div class="app">
  <nav class="rail" aria-label="ניווט ראשי">
    <div class="brand">MAGLARD OS<small>ניהול דירות ותפעול</small></div>
    <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="menu-links">☰ <span id="menu-label">תפריט</span></button>
    <div class="links" id="menu-links">
    <a class="nav" href="#/">מרכז עבודה <span class="cnt" id="cnt-work"></span></a>
    <a class="nav" href="#/tasks" data-perm="tasks.use">משימות <span class="cnt" id="cnt-tasks"></span></a>
    <a class="nav" href="#/notifications">התראות <span class="cnt" id="cnt-notif"></span></a>
    <a class="nav" href="#/apartments" data-perm="apartments.view">דירות</a>
    <a class="nav" href="#/clients" data-perm="apartments.view">לקוחות</a>
    <a class="nav" href="#/owners" data-perm="apartments.view">בעלי דירות</a>
    <a class="nav" href="#/requests" data-perm="requests.view">קריאות שירות <span class="cnt" id="cnt-req"></span></a>
    <a class="nav" href="#/approvals" data-perm="approvals.decide">אישורים <span class="cnt" id="cnt-approvals"></span></a>
    <a class="nav" href="#/suppliers" data-perm="requests.view">ספקים</a>
    <a class="nav" href="#/invoices" data-perm="invoices.view">חשבוניות ספק</a>
    <a class="nav" href="#/sync" data-perm="sync.view">סנכרון Planfix <span class="cnt" id="cnt-sync"></span></a>
    <a class="nav" href="#/users" data-perm="users.manage">משתמשים</a>
    <a class="nav" href="#/audit" data-perm="audit.view">יומן פעולות</a>
    <a class="nav" href="#/help">מדריך קצר</a>
    </div>
  </nav>
  <div class="main">
    <div class="top" role="search">
      <input id="search" type="search" placeholder="חיפוש לקוח, בעל דירה, ספק, כתובת, קוד דירה, קריאה או חשבונית (Ctrl+K)" aria-label="חיפוש" autocomplete="off">
      <div id="hits" class="hits" hidden></div>
    </div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
